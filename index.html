<style>
:root{
  --marine:#14264f; --bleu:#2d4f93; --bordeaux:#8f1f2d; --or:#b8924a;
  --fond:#f3f4f7; --carte:#ffffff; --texte:#1b2236; --discret:#5b647a; --filet:#d5d9e3;
  --serif:Georgia,"Times New Roman",serif; --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--fond);color:var(--texte);min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}

/* En-tête */
.entete{background:var(--marine);color:#fff;border-bottom:4px solid var(--or);
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px}
.entete-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:16px}
.entete img{height:78px;width:auto;flex:none;display:block}
.entete h1{font-family:var(--serif);font-weight:700;font-size:clamp(22px,5vw,32px);margin:0;letter-spacing:.02em}
.entete p{margin:2px 0 0;font-size:14px;color:#c9d2ea}
.tricolore{height:6px;background:linear-gradient(90deg,#2d4f93 33.3%,#fff 33.3% 66.6%,#8f1f2d 66.6%)}

main{max-width:960px;margin:0 auto;padding:28px 20px 48px}
.titre{font-family:var(--serif);font-size:clamp(20px,4vw,26px);text-align:center;margin:0 0 6px;color:var(--marine)}
.sous-titre{text-align:center;color:var(--discret);margin:0 0 24px;font-size:15px}

/* Diagramme */
.disque{display:block;width:min(100%,440px);margin:0 auto}
.seg{cursor:pointer;outline:none}
.seg path{transition:filter .15s, transform .15s;transform-origin:200px 200px;stroke:#fff;stroke-width:3}
.seg:hover path{filter:brightness(1.15)}
.seg:focus-visible path{stroke:var(--or);stroke-width:5}
.seg text{pointer-events:none;font-family:var(--serif);fill:#fff;text-anchor:middle}
.seg .nb{font-family:var(--sans);font-size:12px;opacity:.85}

/* Page de rubrique */
.barre{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.barre h2{font-family:var(--serif);margin:0;flex:1;font-size:clamp(19px,4vw,26px);color:var(--marine)}
.retour{background:none;border:1px solid var(--filet);color:var(--marine);padding:9px 14px;border-radius:6px;background:var(--carte)}
.retour:hover{border-color:var(--marine)}
.plus{width:48px;height:48px;border-radius:50%;border:none;background:var(--marine);color:#fff;font-size:30px;line-height:1;
  display:grid;place-items:center;box-shadow:0 0 0 3px var(--or) inset}
.plus:hover{background:var(--bleu)}
.liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.doc{display:flex;align-items:center;gap:14px;background:var(--carte);border:1px solid var(--filet);border-left:5px solid var(--cat,var(--marine));
  border-radius:6px;padding:10px 12px}
.doc-ouvrir{flex:1 1 0;min-width:0;cursor:pointer;display:flex;align-items:center;gap:14px;background:none;border:none;text-align:left;padding:2px;color:inherit}
.doc-ouvrir:hover .nom{text-decoration:underline}
.vignette{width:56px;height:56px;flex:none;border-radius:4px;background:#e7eaf2 center/cover no-repeat;display:grid;place-items:center;
  color:var(--bordeaux);font-weight:700;font-size:13px;border:1px solid var(--filet)}
.txt{flex:1;min-width:0}
.nom{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.meta{display:block;color:var(--discret);font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.suppr{flex:none;white-space:nowrap;background:none;border:1px solid var(--filet);color:var(--bordeaux);padding:8px 12px;border-radius:6px;font-size:14px}
.suppr:hover{background:var(--bordeaux);color:#fff;border-color:var(--bordeaux)}
.vide{background:var(--carte);border:1px dashed var(--filet);border-radius:6px;padding:36px 20px;text-align:center;color:var(--discret)}

/* Fenêtres */
dialog{border:none;padding:0;color:var(--texte)}
dialog::backdrop{background:rgba(20,38,79,.6)}
#confirm{border-radius:8px;max-width:420px;width:calc(100% - 32px);border-top:5px solid var(--bordeaux)}
#confirm .c{padding:22px}
#confirm h3{font-family:var(--serif);margin:0 0 10px;font-size:20px}
#confirm p{margin:0 0 20px;color:var(--discret);overflow-wrap:anywhere}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:6px;border:1px solid var(--filet);background:#fff;color:var(--texte)}
.btn.danger{background:var(--bordeaux);border-color:var(--bordeaux);color:#fff}
#lecteur{width:100vw;max-width:none;height:100dvh;max-height:none;margin:0;background:#2a2f3d}
#lecteur[open]{display:flex;flex-direction:column}
.lbarre{display:flex;align-items:center;gap:10px;background:var(--marine);color:#fff;padding:10px 14px;border-bottom:3px solid var(--or);flex-wrap:wrap}
.lbarre strong{flex:1;min-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--serif)}
.lbarre .btn{padding:8px 12px;font-size:14px;text-decoration:none;display:inline-block}
.lbarre .zoom-g .btn{font-size:18px}
.lcorps{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:block;position:relative}
.lcorps iframe{border:0;width:100%;height:100%;background:#fff}
.pdfpages{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;width:max-content;min-width:100%}
.pg{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);flex:none}
.pg canvas{display:block;width:100%;height:100%}
.msg{color:#fff;text-align:center;padding:40px 20px}
.zoom-g{display:flex;align-items:center;gap:6px}
.zoom-g .btn{padding:8px 14px;font-size:18px;line-height:1}
#zval{color:#fff;min-width:48px;text-align:center;font-size:14px}
@media (max-width:640px){.lbarre strong{flex:1 0 100%}.lbarre{gap:8px}}
.lcorps img{max-width:100%;height:auto;display:block;margin:auto;cursor:zoom-in}
.lcorps img.zoom{max-width:none;cursor:zoom-out}
.pied{text-align:center;color:var(--discret);font-size:13px;padding:0 20px 28px;max-width:640px;margin:0 auto}
#etat{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--marine);color:#fff;
  padding:12px 18px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);display:none;z-index:50;border-left:4px solid var(--or)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.seg path{transition:none}}
</style>
</head>
<body>

<main id="vue"></main>
<p class="pied" id="pied">Les documents sont enregistrés sur cet appareil, dans ce navigateur.</p>

<input type="file" id="fichier" accept="application/pdf,image/*" multiple hidden>

<dialog id="confirm" aria-labelledby="ctitre">
  <div class="c">
    <h3 id="ctitre">Confirmer la suppression</h3>
    <p id="ctexte"></p>
    <div class="actions">
      <button class="btn" id="cnon">Annuler</button>
      <button class="btn danger" id="coui">Supprimer définitivement</button>
    </div>
  </div>
</dialog>

<dialog id="lecteur" aria-label="Lecture du document">
  <div class="lbarre">
    <strong id="ltitre"></strong>
    <div class="zoom-g" id="zoomg" hidden>
      <button class="btn" id="zmoins" aria-label="Réduire">−</button>
      <span id="zval">100 %</span>
      <button class="btn" id="zplus" aria-label="Agrandir">+</button>
      <button class="btn" id="zfit" style="font-size:14px">Ajuster</button>
    </div>
    <a class="btn" id="longlet" target="_blank" rel="noopener">Ouvrir dans un onglet</a>
    <button class="btn" id="lsuppr" style="color:#8f1f2d">Supprimer</button>
    <button class="btn" id="lferme">Fermer</button>
  </div>
  <div class="lcorps" id="lcorps"></div>
</dialog>

<div id="etat" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const CATS = {
  permanent:  { titre:'Arrêté permanent',  lignes:['Arrêté','permanent'],  couleur:'#14264f' },
  saisonnier: { titre:'Arrêté saisonnier', lignes:['Arrêté','saisonnier'], couleur:'#2d4f93' },
  temporaire: { titre:'Arrêté temporaire', lignes:['Arrêté','temporaire'], couleur:'#8f1f2d' }
};
const $ = s => document.querySelector(s);
let db, urls = [], courant = null;

/* ---------- Stockage local (IndexedDB) ---------- */
const ouvrirDB = () => new Promise((ok, ko) => {
  const r = indexedDB.open('pm-arretes', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('docs', { keyPath:'id', autoIncrement:true }).createIndex('cat','cat');
  r.onsuccess = () => ok(r.result);
  r.onerror = () => ko(r.error);
});
const req = r => new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const st = m => db.transaction('docs', m).objectStore('docs');
const compter = c => req(st('readonly').index('cat').count(c));
const lister = c => req(st('readonly').index('cat').getAll(c));
const ajouter = d => req(st('readwrite').add(d));
const retirer = id => req(st('readwrite').delete(id));

/* ---------- Utilitaires ---------- */
const taille = n => n < 1048576 ? Math.max(1, Math.round(n/1024)) + ' Ko' : (n/1048576).toFixed(1).replace('.',',') + ' Mo';
const dateFr = t => new Date(t).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
const estPdf = f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
const estImage = f => f.type.startsWith('image/');
let minuteur;
function message(t){ const e = $('#etat'); e.textContent = t; e.style.display = 'block'; clearTimeout(minuteur); minuteur = setTimeout(() => e.style.display = 'none', 4500); }
function libererUrls(){ urls.forEach(u => URL.revokeObjectURL(u)); urls = []; }
function el(tag, cls, txt){ const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }

/* ---------- Accueil : diagramme circulaire ---------- */
async function accueil(){
  libererUrls();
  const nb = {}; for (const k in CATS) nb[k] = await compter(k);
  const total = Object.values(nb).reduce((a,b) => a+b, 0);
  const NS = 'http://www.w3.org/2000/svg', R = 190, r = 82, C = 200;
  const pt = (a, ray) => [C + ray*Math.cos(a), C + ray*Math.sin(a)].map(v => v.toFixed(2)).join(' ');
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 400 400'); svg.setAttribute('class', 'disque');
  svg.setAttribute('role', 'group'); svg.setAttribute('aria-label', 'Choisir une catégorie d\'arrêtés');
  Object.keys(CATS).forEach((k, i) => {
    const c = CATS[k], a0 = (-150 + i*120) * Math.PI/180 + .012, a1 = (-30 + i*120) * Math.PI/180 - .012, m = (a0 + a1)/2;
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'seg'); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'link');
    g.setAttribute('aria-label', `${c.titre}, ${nb[k]} document${nb[k] > 1 ? 's' : ''}`);
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', `M${pt(a0,R)} A${R} ${R} 0 0 1 ${pt(a1,R)} L${pt(a1,r)} A${r} ${r} 0 0 0 ${pt(a0,r)} Z`);
    p.setAttribute('fill', c.couleur); g.appendChild(p);
    const [tx, ty] = [C + 136*Math.cos(m), C + 136*Math.sin(m)];
    [[c.lignes[0], -10, 15, 0], [c.lignes[1], 9, 17, 700], [`${nb[k]} doc.`, 27, 12, 0]].forEach(([t, dy, fs, fw], j) => {
      const x = document.createElementNS(NS, 'text');
      x.setAttribute('x', tx.toFixed(1)); x.setAttribute('y', (ty + dy).toFixed(1));
      x.setAttribute('font-size', fs); if (fw) x.setAttribute('font-weight', fw);
      if (j === 2) x.setAttribute('class', 'nb');
      x.textContent = t; g.appendChild(x);
    });
    const go = () => { location.hash = k; };
    g.addEventListener('click', go);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    svg.appendChild(g);
  });
  const centre = document.createElementNS(NS, 'g');
  centre.innerHTML = `<circle cx="200" cy="200" r="70" fill="#fff" stroke="#b8924a" stroke-width="3"/>
    <text x="200" y="192" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#14264f">Arrêtés</text>
    <text x="200" y="212" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#14264f">municipaux</text>
    <text x="200" y="234" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5b647a">${total} au total</text>`;
  svg.appendChild(centre);

  const v = $('#vue'); v.replaceChildren();
  v.append(el('h2', 'titre', 'Consultation des arrêtés'), el('p', 'sous-titre', 'Sélectionnez une catégorie pour consulter ou ajouter des documents.'), svg);
}

/* ---------- Page d'une catégorie ---------- */
async function rubrique(k){
  libererUrls();
  const c = CATS[k], docs = (await lister(k)).sort((a,b) => b.date - a.date);
  const v = $('#vue'); v.replaceChildren();
  const barre = el('div', 'barre');
  const retour = el('button', 'retour', '‹ Accueil'); retour.onclick = () => { location.hash = ''; };
  const plus = el('button', 'plus', '+'); plus.setAttribute('aria-label', 'Ajouter un document (PDF ou photo)'); plus.title = 'Ajouter un document';
  plus.onclick = () => { courant = k; $('#fichier').click(); };
  barre.append(retour, el('h2', null, c.titre), plus);
  v.appendChild(barre);

  if (!docs.length){
    v.appendChild(el('div', 'vide', 'Aucun document dans cette catégorie. Utilisez le bouton « + » pour ajouter un fichier PDF ou une photo.'));
    return;
  }
  const ul = el('ul', 'liste');
  docs.forEach(d => {
    const li = el('li', 'doc'); li.style.setProperty('--cat', c.couleur);
    const ouvrir = el('button', 'doc-ouvrir');
    const vig = el('span', 'vignette');
    if (d.genre === 'image'){ const u = URL.createObjectURL(d.blob); urls.push(u); vig.style.backgroundImage = `url("${u}")`; } else vig.textContent = 'PDF';
    const txt = el('span', 'txt'); txt.append(el('span', 'nom', d.nom), el('span', 'meta', `${d.genre === 'pdf' ? 'Document PDF' : 'Photo'} · ${taille(d.taille)} · ajouté le ${dateFr(d.date)}`));
    ouvrir.append(vig, txt); ouvrir.onclick = () => lire(d, k);
    const s = el('button', 'suppr', 'Supprimer'); s.onclick = () => demanderSuppression(d, k);
    li.append(ouvrir, s); ul.appendChild(li);
  });
  v.appendChild(ul);
}

/* ---------- Ajout ---------- */
$('#fichier').addEventListener('change', async e => {
  const k = courant, fichiers = [...e.target.files]; e.target.value = '';
  if (!k || !fichiers.length) return;
  let ok = 0; const refus = [];
  for (const f of fichiers){
    if (!estPdf(f) && !estImage(f)) { refus.push(f.name); continue; }
    try { await ajouter({ cat:k, nom:f.name, genre: estPdf(f) ? 'pdf' : 'image', type: estPdf(f) ? 'application/pdf' : f.type, taille:f.size, date:Date.now(), blob:f }); ok++; }
    catch(err){ refus.push(f.name); }
  }
  await rubrique(k);
  message(ok ? `${ok} document${ok > 1 ? 's ajoutés' : ' ajouté'}.` + (refus.length ? ` Non pris en charge : ${refus.join(', ')}.` : '') : `Aucun document ajouté. Formats acceptés : PDF et images.`);
});

/* ---------- Lecture ---------- */
let docOuvert = null, urlOuverte = null, pdfDoc = null, zoom = 1, jeton = 0;
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function lire(d, k){
  docOuvert = { d, k };
  urlOuverte = URL.createObjectURL(new Blob([d.blob], { type: d.type }));
  $('#ltitre').textContent = d.nom;
  $('#longlet').href = urlOuverte;
  const corps = $('#lcorps'); corps.replaceChildren();
  $('#zoomg').hidden = d.genre !== 'pdf';
  $('#lecteur').showModal();
  if (d.genre === 'pdf') lirePdf(d, corps);
  else { const i = document.createElement('img'); i.src = urlOuverte; i.alt = d.nom; i.title = 'Toucher pour agrandir ou réduire'; i.onclick = () => i.classList.toggle('zoom'); corps.appendChild(i); }
}

async function lirePdf(d, corps){
  corps.appendChild(el('p', 'msg', 'Chargement du document…'));
  try {
    if (!window.pdfjsLib) throw new Error('pdfjs');
    const buf = await new Response(d.blob).arrayBuffer();
    pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
    zoom = 1; await dessinerPdf();
  } catch (e) {
    corps.replaceChildren();
    $('#zoomg').hidden = true;
    const f = document.createElement('iframe'); f.src = urlOuverte; f.title = d.nom; corps.appendChild(f);
  }
}

async function dessinerPdf(){
  if (!pdfDoc) return;
  const corps = $('#lcorps'), tok = ++jeton;
  const ratio = corps.scrollHeight ? corps.scrollTop / corps.scrollHeight : 0;
  const largeur = Math.max(200, corps.clientWidth - 20);
  const conteneur = el('div', 'pdfpages'), pages = [];
  for (let n = 1; n <= pdfDoc.numPages; n++){
    const page = await pdfDoc.getPage(n);
    if (tok !== jeton) return;
    const base = page.getViewport({ scale: 1 });
    const echelle = (largeur / base.width) * zoom;
    const vp = page.getViewport({ scale: echelle });
    const bloc = el('div', 'pg'); bloc.style.width = vp.width + 'px'; bloc.style.height = vp.height + 'px';
    bloc.setAttribute('aria-label', `Page ${n} sur ${pdfDoc.numPages}`);
    pages.push({ bloc, page, echelle, vp, fait:false });
    conteneur.appendChild(bloc);
  }
  corps.replaceChildren(conteneur);
  corps.scrollTop = ratio * corps.scrollHeight;
  $('#zval').textContent = Math.round(zoom * 100) + ' %';
  const obs = new IntersectionObserver(entrees => {
    entrees.forEach(en => {
      if (!en.isIntersecting) return;
      const p = pages.find(x => x.bloc === en.target);
      if (!p || p.fait || tok !== jeton) return;
      p.fait = true; obs.unobserve(p.bloc);
      let dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      while (p.vp.width * p.vp.height * dpr * dpr > 14e6 && dpr > 1) dpr -= .25;
      const cv = document.createElement('canvas');
      cv.width = Math.floor(p.vp.width * dpr); cv.height = Math.floor(p.vp.height * dpr);
      p.bloc.appendChild(cv);
      p.page.render({ canvasContext: cv.getContext('2d'), viewport: p.page.getViewport({ scale: p.echelle * dpr }) });
    });
  }, { root: corps, rootMargin: '800px 0px' });
  pages.forEach(p => obs.observe(p.bloc));
}

function changerZoom(z){
  z = Math.min(4, Math.max(.5, Math.round(z * 100) / 100));
  if (z === zoom) return;
  zoom = z; dessinerPdf();
}
$('#zplus').onclick = () => changerZoom(zoom + .25);
$('#zmoins').onclick = () => changerZoom(zoom - .25);
$('#zfit').onclick = () => changerZoom(1);

function fermerLecteur(){ $('#lecteur').close(); }
$('#lferme').onclick = fermerLecteur;
$('#lecteur').addEventListener('close', () => {
  jeton++; $('#lcorps').replaceChildren();
  if (pdfDoc){ pdfDoc.destroy(); pdfDoc = null; }
  if (urlOuverte) URL.revokeObjectURL(urlOuverte); urlOuverte = null;
});
$('#lsuppr').onclick = () => { if (docOuvert) demanderSuppression(docOuvert.d, docOuvert.k); };

/* ---------- Suppression avec confirmation ---------- */
let aSupprimer = null;
function demanderSuppression(d, k){
  aSupprimer = { d, k };
  $('#ctexte').textContent = `Le document « ${d.nom} » sera supprimé définitivement. Cette action est irréversible.`;
  $('#confirm').showModal();
  $('#cnon').focus();
}
$('#cnon').onclick = () => { aSupprimer = null; $('#confirm').close(); };
$('#coui').onclick = async () => {
  if (!aSupprimer) return;
  const { d, k } = aSupprimer; aSupprimer = null;
  $('#confirm').close();
  await retirer(d.id);
  if ($('#lecteur').open) fermerLecteur();
  await rubrique(k);
  message('Document supprimé.');
};

/* ---------- Navigation ---------- */
async function route(){
  const k = location.hash.slice(1);
  window.scrollTo(0, 0);
  if (CATS[k]) await rubrique(k); else await accueil();
}
window.addEventListener('hashchange', route);

(async () => {
  try { db = await ouvrirDB(); await route(); }
  catch(e){ $('#vue').replaceChildren(el('div', 'vide', 'Le stockage local est indisponible dans ce navigateur (navigation privée ?). Ouvrez l\'application dans une fenêtre normale.')); }
})();
</script>
